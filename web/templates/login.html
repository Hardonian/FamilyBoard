{{define "content"}}
<div class="login-wrapper">
  <div class="modal-dialog login-dialog">
    <h2 class="modal-title login-title">FamilyBoard Admin</h2>
    <p class="login-sub">Please authenticate to access appliance settings</p>

    {{if .Error}}
    <div class="login-error">
      {{.Error}}
    </div>
    {{end}}

    <form method="POST" action="/login" class="login-form">
      <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
      <input type="hidden" name="next" value="{{.Next}}">

      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input type="text" id="username" name="username" class="form-input" required autofocus autocomplete="username" value="{{.Username}}">
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" name="password" class="form-input" required autocomplete="current-password">
      </div>

      <button type="submit" class="btn btn-primary login-submit-btn">Sign In</button>
    </form>

    <div class="login-footer">
      <a href="/" class="login-return-link">← Return to Calendar Kiosk</a>
    </div>
  </div>
</div>
{{end}}
