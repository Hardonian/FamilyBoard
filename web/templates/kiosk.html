{{define "content"}}
<header class="kiosk-header">
  <div class="header-clock-section">
    <div id="clock-time" class="header-time">--:--</div>
    <div id="clock-date" class="header-date">Loading date...</div>
  </div>

  <div class="header-controls">
    <div id="status-badge" class="status-badge">
      <span class="status-dot"></span>
      <span id="status-text">Appliance Ready</span>
    </div>

    <div class="view-selector">
      <button class="view-btn active" data-view="month">Month</button>
      <button class="view-btn" data-view="agenda">Agenda</button>
    </div>

    <button id="btn-add-event" class="btn btn-primary">+ Add Event</button>
  </div>
</header>

<main class="calendar-container">
  <div class="calendar-nav-bar">
    <h2 id="nav-title" class="nav-title">Loading...</h2>
    <div class="nav-arrows">
      <button id="btn-today" class="btn btn-secondary">Today</button>
      <button id="btn-prev" class="arrow-btn" aria-label="Previous Month">‹</button>
      <button id="btn-next" class="arrow-btn" aria-label="Next Month">›</button>
    </div>
  </div>

  <div id="month-grid" class="month-grid">
    <div class="weekday-header">
      <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
    </div>
    <div id="days-grid" class="days-grid"></div>
  </div>

  <div id="agenda-view" class="agenda-view" style="display: none;"></div>
</main>

<!-- Add/Edit Event Modal -->
<div id="event-modal" class="modal-overlay" style="display: none;">
  <div class="modal-dialog">
    <h3 id="modal-title" class="modal-title">New Family Event</h3>
    <form id="event-form">
      <input type="hidden" id="event-id">

      <div class="form-group">
        <label class="form-label" for="event-title">Event Title</label>
        <input type="text" id="event-title" class="form-input" required placeholder="e.g. Soccer Practice">
      </div>

      <div class="form-group">
        <label class="form-label" for="event-calendar-id">Calendar</label>
        <select id="event-calendar-id" class="form-select"></select>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="event-start-date">Date</label>
          <input type="date" id="event-start-date" class="form-input" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="event-start-time">Start Time</label>
          <input type="time" id="event-start-time" class="form-input">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="event-end-date">End Date</label>
          <input type="date" id="event-end-date" class="form-input" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="event-end-time">End Time</label>
          <input type="time" id="event-end-time" class="form-input">
        </div>
      </div>

      <div class="form-group" style="flex-direction: row; align-items: center; gap: 8px;">
        <input type="checkbox" id="event-all-day" style="width: 22px; height: 22px;">
        <label class="form-label" for="event-all-day" style="cursor: pointer;">All-Day Event</label>
      </div>

      <div class="form-group">
        <label class="form-label" for="event-location">Location (optional)</label>
        <input type="text" id="event-location" class="form-input" placeholder="e.g. Community Centre">
      </div>

      <div class="form-group">
        <label class="form-label" for="event-description">Notes (optional)</label>
        <textarea id="event-description" class="form-textarea" rows="2"></textarea>
      </div>

      <div class="modal-actions">
        <button type="button" id="btn-delete-event" class="btn btn-danger" style="display: none; margin-right: auto;">Delete</button>
        <button type="button" id="btn-cancel-modal" class="btn btn-secondary">Cancel</button>
        <button type="submit" class="btn btn-primary">Save Event</button>
      </div>
    </form>
  </div>
</div>
{{end}}

{{define "scripts"}}
<script src="/static/js/kiosk.js"></script>
{{end}}
